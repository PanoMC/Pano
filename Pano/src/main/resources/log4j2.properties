# Extra logging related to initialization of Log4j
# Set to debug or trace if log4j initialization is failing
status=warn
# Name of the configuration
name=Pano
# Appenders
appenders = console, rolling

# Console appender configuration
appender.console.type=Console
appender.console.name=consoleLogger
appender.console.layout.type=PatternLayout
appender.console.layout.pattern=[%d %highlight{${LOG_LEVEL_PATTERN:-%p}}{ERROR=red, WARN=yellow bold, INFO=green, DEBUG=green bold, TRACE=blue}]: [%c{1}] - %m%n
appender.console.follow = true
# Filter to suppress "forcibly closed" and "connection was closed" errors
appender.console.filter.reset.type = RegexFilter
appender.console.filter.reset.regex=.*(An existing connection was forcibly closed by the remote host|Connection was closed).*
appender.console.filter.reset.onMatch = DENY
appender.console.filter.reset.onMismatch = NEUTRAL

# RollingFile appender configuration
appender.rolling.type = RollingFile
appender.rolling.name = rollingLogger
appender.rolling.fileName = logs/latest.log
appender.rolling.filePattern = logs/%d{yyyy-MM-dd}-%i.log.gz
appender.rolling.layout.type = PatternLayout
appender.rolling.layout.pattern = [%d{HH:mm:ss} %p]: [%c{1}] - %m%n
appender.rolling.policies.type = Policies
appender.rolling.policies.startup.type = OnStartupTriggeringPolicy
appender.rolling.policies.size.type = SizeBasedTriggeringPolicy
appender.rolling.policies.size.size = 20MB
appender.rolling.strategy.type = DefaultRolloverStrategy
appender.rolling.strategy.max = 100

# Root logger level
rootLogger.level=info
# Root logger referring to appenders
rootLogger.appenderRef.stdout.ref=consoleLogger
rootLogger.appenderRef.rolling.ref=rollingLogger