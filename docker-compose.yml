version: '3'
services:
  db:
    image: mariadb:11.8
    command: [ "--character-set-server=utf8", "--collation-server=utf8_unicode_ci" ,"--default-authentication-plugin=mysql_native_password" ]
    restart: always
    environment:
      MYSQL_DATABASE: pano
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-pano}
    ports:
      - "127.0.0.1:3306:3306"
    volumes:
      - .docker/database:/var/lib/mysql
