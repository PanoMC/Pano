kotlin.code.style=official
org.gradle.parallel=true
org.gradle.caching=true
pf4jVersion=3.16.0
vertxVersion=5.1.10
gsonVersion=2.14.0
springContextVersion=5.3.39
bootstrap=true
org.gradle.jvmargs=-Xmx2g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8
kotlin.daemon.jvmargs=-Xmx3g
# Extension contract level (doc 04 section 7). panoApiLevel rises when the contract gains something a resource may
# rely on; panoMinApiLevel only on a break. Expanded into pano-api-level.properties and the jar manifest.
panoApiLevel=1
panoMinApiLevel=1

# pf4j's processor is given to kapt explicitly; do not scan the compile classpath for more
kapt.include.compile.classpath=false
